<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>포쿨 광고 대시보드</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#faf8f5;--card:#fff;--border:#e8e4df;--text:#2d2a26;--sub:#8a8580;
  --blue:#5b8def;--green:#4caf7d;--red:#e8636f;--orange:#f5a623;--purple:#9b6dff;
  --shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --shadow-lg:0 4px 12px rgba(0,0,0,.08);
}
body{font-family:Pretendard,-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
.container{max-width:1400px;margin:0 auto;padding:20px 24px}

/* Header */
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:12px}
.header h1{font-size:22px;font-weight:700;letter-spacing:-.3px}
.header h1 span{color:var(--blue);font-weight:800}
.header-right{display:flex;align-items:center;gap:10px}
.period-badge{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:6px 14px;font-size:13px;color:var(--sub)}
.btn{padding:8px 16px;border-radius:8px;border:none;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s}
.btn-primary{background:var(--blue);color:#fff}
.btn-primary:hover{background:#4a7cde}
.btn-outline{background:var(--card);border:1px solid var(--border);color:var(--text)}
.btn-outline:hover{border-color:var(--blue);color:var(--blue)}
.btn-ai{background:linear-gradient(135deg,#9b6dff,#5b8def);color:#fff}
.btn-ai:hover{opacity:.9}
.status-dot{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block;margin-right:6px}
.status-text{font-size:12px;color:var(--sub)}

/* KPI Cards */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:24px}
.kpi-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px 20px;box-shadow:var(--shadow);transition:box-shadow .15s}
.kpi-card:hover{box-shadow:var(--shadow-lg)}
.kpi-label{font-size:12px;color:var(--sub);font-weight:500;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.kpi-icon{width:18px;height:18px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff}
.kpi-value{font-size:26px;font-weight:700;letter-spacing:-.5px;margin-bottom:4px}
.kpi-change{font-size:12px;font-weight:600;display:flex;align-items:center;gap:3px}
.kpi-change.up{color:var(--green)}
.kpi-change.down{color:var(--red)}
.kpi-change.neutral{color:var(--sub)}
.kpi-prev{font-size:11px;color:var(--sub);margin-top:2px}

/* Chart Section */
.section{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;box-shadow:var(--shadow);margin-bottom:20px}
.section-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:8px}
.section-title{font-size:15px;font-weight:700}
.chart-tabs{display:flex;gap:4px}
.chart-tab{padding:5px 12px;border-radius:6px;font-size:12px;font-weight:600;border:none;cursor:pointer;background:transparent;color:var(--sub);transition:all .15s}
.chart-tab.active{background:var(--blue);color:#fff}
.chart-container{position:relative;height:280px}

/* Table */
.table-controls{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px}
.search-input{padding:7px 12px;border:1px solid var(--border);border-radius:8px;font-size:13px;width:240px;outline:none;font-family:inherit}
.search-input:focus{border-color:var(--blue)}
.filter-group{display:flex;gap:4px}
.filter-btn{padding:5px 12px;border-radius:6px;font-size:12px;font-weight:500;border:1px solid var(--border);cursor:pointer;background:var(--card);color:var(--sub);transition:all .15s}
.filter-btn.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:10px 12px;font-weight:600;color:var(--sub);font-size:11px;text-transform:uppercase;letter-spacing:.3px;border-bottom:2px solid var(--border);cursor:pointer;white-space:nowrap;user-select:none}
th:hover{color:var(--text)}
th .sort-icon{margin-left:3px;opacity:.4}
th.sorted .sort-icon{opacity:1;color:var(--blue)}
td{padding:10px 12px;border-bottom:1px solid #f3f1ee;white-space:nowrap}
tr:hover td{background:#faf8f5}
.camp-name{max-width:260px;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.type-badge{padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600}
.type-SHOPPING{background:#e8f4fd;color:#1a73e8}
.type-WEB_SITE{background:#e8f5e9;color:#2e7d32}
.type-POWER_CONTENTS{background:#fff3e0;color:#ef6c00}
.type-BRAND_SEARCH{background:#f3e8fd;color:#7b1fa2}
.num{text-align:right;font-variant-numeric:tabular-nums}
.num-highlight{font-weight:600;color:var(--text)}

/* AI Panel */
.ai-panel{background:linear-gradient(135deg,#f8f6ff,#f0f4ff);border:1px solid #e0d8f8;border-radius:12px;padding:20px;margin-bottom:20px}
.ai-panel-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.ai-panel-title{font-size:15px;font-weight:700;color:#6b4ce6}
.ai-result{font-size:13px;line-height:1.8;color:var(--text);white-space:pre-wrap}
.ai-result h4{font-size:14px;font-weight:700;margin:12px 0 6px;color:#5b4cbe}
.ai-loading{display:flex;align-items:center;gap:8px;color:var(--sub);font-size:13px}
.spinner{width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Settings Modal */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;justify-content:center;align-items:center}
.modal-overlay.show{display:flex}
.modal{background:var(--card);border-radius:14px;padding:28px;width:90%;max-width:420px;box-shadow:0 20px 40px rgba(0,0,0,.15)}
.modal h3{font-size:17px;font-weight:700;margin-bottom:16px}
.modal label{font-size:12px;font-weight:600;color:var(--sub);display:block;margin-bottom:4px;margin-top:12px}
.modal input{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}

/* Responsive */
@media(max-width:768px){
  .container{padding:12px}
  .kpi-grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .kpi-value{font-size:20px}
  .header h1{font-size:18px}
  .chart-container{height:220px}
  .search-input{width:100%}
}
@media(max-width:480px){
  .kpi-grid{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>

<div class="container">
  <!-- Header -->
  <div class="header">
    <div>
      <h1><span>포쿨</span> 광고 대시보드</h1>
      <div style="display:flex;align-items:center;gap:6px;margin-top:4px">
        <span class="status-dot" id="statusDot"></span>
        <span class="status-text" id="statusText">데이터 로딩 중...</span>
      </div>
    </div>
    <div class="header-right">
      <span class="period-badge" id="periodBadge">-</span>
      <button class="btn btn-outline" onclick="refreshData()">새로고침</button>
      <button class="btn btn-outline" onclick="showSettings()">설정</button>
    </div>
  </div>

  <!-- KPI Cards -->
  <div class="kpi-grid" id="kpiGrid"></div>

  <!-- Daily Chart -->
  <div class="section">
    <div class="section-header">
      <span class="section-title">일별 추이</span>
      <div class="chart-tabs" id="chartTabs">
        <button class="chart-tab active" data-metric="salesAmt">광고비</button>
        <button class="chart-tab" data-metric="clkCnt">클릭수</button>
        <button class="chart-tab" data-metric="impCnt">노출수</button>
        <button class="chart-tab" data-metric="ccnt">전환수</button>
        <button class="chart-tab" data-metric="convAmt">전환매출</button>
      </div>
    </div>
    <div class="chart-container">
      <canvas id="dailyChart"></canvas>
    </div>
  </div>

  <!-- AI Analysis -->
  <div class="ai-panel">
    <div class="ai-panel-header">
      <span class="ai-panel-title">AI 성과 분석</span>
      <button class="btn btn-ai" onclick="runAIAnalysis()">AI 분석 실행</button>
    </div>
    <div id="aiResult" class="ai-result" style="color:var(--sub)">AI 분석 버튼을 클릭하면 Claude가 광고 성과를 분석합니다.</div>
  </div>

  <!-- Campaign Table -->
  <div class="section">
    <div class="section-header">
      <span class="section-title">캠페인 성과 (<span id="campCount">0</span>개)</span>
    </div>
    <div class="table-controls">
      <input type="text" class="search-input" id="searchInput" placeholder="캠페인 검색...">
      <div class="filter-group" id="filterGroup">
        <button class="filter-btn active" data-type="ALL">전체</button>
        <button class="filter-btn" data-type="SHOPPING">쇼핑</button>
        <button class="filter-btn" data-type="WEB_SITE">파워링크</button>
        <button class="filter-btn" data-type="POWER_CONTENTS">파워콘텐츠</button>
        <button class="filter-btn" data-type="BRAND_SEARCH">브랜드</button>
      </div>
    </div>
    <div class="table-wrap">
      <table>
        <thead id="tableHead"></thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- Settings Modal -->
<div class="modal-overlay" id="settingsModal">
  <div class="modal">
    <h3>설정</h3>
    <label>Cloudflare Worker URL</label>
    <input id="workerUrl" placeholder="https://your-worker.workers.dev">
    <label>Claude API Key</label>
    <input id="claudeKey" type="password" placeholder="sk-ant-...">
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeSettings()">취소</button>
      <button class="btn btn-primary" onclick="saveSettings()">저장</button>
    </div>
  </div>
</div>

<script>
// ── Embedded Data (static snapshot) ──
const EMBEDDED_DATA = {
  "generated":"2026-03-21T03:39:00",
  "period":{"since":"2026-03-14","until":"2026-03-20"},
  "prevPeriod":{"since":"2026-03-07","until":"2026-03-13"},
  "kpi":{"impCnt":388178,"clkCnt":4484,"ctr":1.16,"cpc":1240,"salesAmt":5558333,"ccnt":554,"convAmt":1100852610,"ror":19805.45,"crto":12.36,"cpConv":10033},
  "prevKpi":{"impCnt":395446,"clkCnt":4314,"ctr":1.09,"cpc":1146,"salesAmt":4942179,"ccnt":265,"convAmt":395752620,"ror":8007.65,"crto":6.14,"cpConv":18650},
  "daily":[
    {"date":"2026-03-14","impCnt":50233,"clkCnt":458,"salesAmt":519233,"ccnt":52,"convAmt":108453780},
    {"date":"2026-03-15","impCnt":48227,"clkCnt":538,"salesAmt":582098,"ccnt":58,"convAmt":114779300},
    {"date":"2026-03-16","impCnt":56633,"clkCnt":711,"salesAmt":816123,"ccnt":113,"convAmt":243926700},
    {"date":"2026-03-17","impCnt":50302,"clkCnt":697,"salesAmt":838332,"ccnt":100,"convAmt":216487200},
    {"date":"2026-03-18","impCnt":55635,"clkCnt":688,"salesAmt":783805,"ccnt":89,"convAmt":178175770},
    {"date":"2026-03-19","impCnt":62054,"clkCnt":732,"salesAmt":1039335,"ccnt":74,"convAmt":141693520},
    {"date":"2026-03-20","impCnt":65094,"clkCnt":660,"salesAmt":979407,"ccnt":68,"convAmt":97336340}
  ],
  "campaigns":null,
  "totalCampaigns":160,
  "statsCollected":74
};

// ── State ──
let DATA = null;
let dailyChart = null;
let currentMetric = 'salesAmt';
let currentFilter = 'ALL';
let sortCol = 'salesAmt';
let sortDir = -1; // desc

// ── Settings ──
const DEFAULT_WORKER_URL = 'https://pokool-ad-dashboard.pokool-ad.workers.dev';
function getSettings() {
  try {
    const s = JSON.parse(localStorage.getItem('pokool_dash_settings') || '{}');
    if (!s.workerUrl) s.workerUrl = DEFAULT_WORKER_URL;
    return s;
  } catch { return { workerUrl: DEFAULT_WORKER_URL }; }
}
function showSettings() {
  const s = getSettings();
  document.getElementById('workerUrl').value = s.workerUrl || '';
  document.getElementById('claudeKey').value = s.claudeKey || '';
  document.getElementById('settingsModal').classList.add('show');
}
function closeSettings() { document.getElementById('settingsModal').classList.remove('show'); }
function saveSettings() {
  const s = { workerUrl: document.getElementById('workerUrl').value.trim(), claudeKey: document.getElementById('claudeKey').value.trim() };
  localStorage.setItem('pokool_dash_settings', JSON.stringify(s));
  closeSettings();
  if (s.workerUrl) refreshData();
}

// ── Number Formatting ──
function fmt(n, type) {
  if (n == null || isNaN(n)) return '-';
  if (type === 'money') return Math.round(n).toLocaleString('ko-KR') + '원';
  if (type === 'bigmoney') {
    if (n >= 100000000) return (n / 100000000).toFixed(1) + '억';
    if (n >= 10000) return (n / 10000).toFixed(0) + '만';
    return Math.round(n).toLocaleString('ko-KR') + '원';
  }
  if (type === 'pct') return n.toFixed(2) + '%';
  if (type === 'int') return Math.round(n).toLocaleString('ko-KR');
  return n.toLocaleString('ko-KR');
}

function pctChange(curr, prev) {
  if (!prev || prev === 0) return { val: 0, cls: 'neutral', txt: '-' };
  const p = ((curr - prev) / prev) * 100;
  const cls = p > 0 ? 'up' : p < 0 ? 'down' : 'neutral';
  const arrow = p > 0 ? '▲' : p < 0 ? '▼' : '';
  return { val: p, cls, txt: `${arrow} ${Math.abs(p).toFixed(1)}%` };
}

// ── KPI Cards ──
const KPI_DEFS = [
  { key: 'impCnt', label: '노출수', fmt: 'int', color: '#5b8def', icon: '👁' },
  { key: 'clkCnt', label: '클릭수', fmt: 'int', color: '#4caf7d', icon: '👆' },
  { key: 'ctr', label: 'CTR', fmt: 'pct', color: '#f5a623', icon: '%', invertChange: false },
  { key: 'salesAmt', label: '광고비', fmt: 'bigmoney', color: '#e8636f', icon: '₩', invertChange: true },
  { key: 'ccnt', label: '전환수', fmt: 'int', color: '#9b6dff', icon: '✓' },
  { key: 'ror', label: 'ROAS', fmt: 'pct', color: '#2196f3', icon: 'R' },
];

function renderKPI() {
  const g = document.getElementById('kpiGrid');
  const k = DATA.kpi, pk = DATA.prevKpi;
  g.innerHTML = KPI_DEFS.map(d => {
    const ch = pctChange(k[d.key], pk[d.key]);
    // For cost, up = bad (red), down = good (green)
    let changeCls = ch.cls;
    if (d.invertChange && ch.cls === 'up') changeCls = 'down';
    else if (d.invertChange && ch.cls === 'down') changeCls = 'up';
    return `<div class="kpi-card">
      <div class="kpi-label"><span class="kpi-icon" style="background:${d.color}">${d.icon}</span>${d.label}</div>
      <div class="kpi-value">${fmt(k[d.key], d.fmt)}</div>
      <div class="kpi-change ${changeCls}">${ch.txt} <span style="font-weight:400;color:var(--sub);margin-left:4px">vs 전주</span></div>
      <div class="kpi-prev">전주: ${fmt(pk[d.key], d.fmt)}</div>
    </div>`;
  }).join('');
}

// ── Daily Chart ──
const METRIC_LABELS = { salesAmt: '광고비', clkCnt: '클릭수', impCnt: '노출수', ccnt: '전환수', convAmt: '전환매출' };
const METRIC_COLORS = { salesAmt: '#e8636f', clkCnt: '#4caf7d', impCnt: '#5b8def', ccnt: '#9b6dff', convAmt: '#f5a623' };

function renderChart() {
  const ctx = document.getElementById('dailyChart').getContext('2d');
  if (dailyChart) dailyChart.destroy();

  const labels = DATA.daily.map(d => {
    const dt = new Date(d.date);
    return `${dt.getMonth()+1}/${dt.getDate()}(${['일','월','화','수','목','금','토'][dt.getDay()]})`;
  });
  const values = DATA.daily.map(d => d[currentMetric] || 0);
  const color = METRIC_COLORS[currentMetric];

  dailyChart = new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [{
        label: METRIC_LABELS[currentMetric],
        data: values,
        borderColor: color,
        backgroundColor: color + '18',
        fill: true,
        tension: .35,
        pointRadius: 4,
        pointHoverRadius: 6,
        pointBackgroundColor: '#fff',
        pointBorderColor: color,
        pointBorderWidth: 2,
        borderWidth: 2.5,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#fff',
          titleColor: '#2d2a26',
          bodyColor: '#2d2a26',
          borderColor: '#e8e4df',
          borderWidth: 1,
          cornerRadius: 8,
          padding: 12,
          titleFont: { family: 'Pretendard', weight: '600' },
          bodyFont: { family: 'Pretendard' },
          callbacks: {
            label: ctx => {
              const v = ctx.raw;
              if (['salesAmt','convAmt'].includes(currentMetric)) return fmt(v, 'money');
              return fmt(v, 'int');
            }
          }
        }
      },
      scales: {
        x: { grid: { display: false }, ticks: { font: { family: 'Pretendard', size: 11 } } },
        y: {
          grid: { color: '#f3f1ee' },
          ticks: {
            font: { family: 'Pretendard', size: 11 },
            callback: v => {
              if (v >= 100000000) return (v/100000000).toFixed(0) + '억';
              if (v >= 10000) return (v/10000).toFixed(0) + '만';
              return v.toLocaleString();
            }
          }
        }
      }
    }
  });
}

// ── Campaign Table ──
const TABLE_COLS = [
  { key: 'name', label: '캠페인', sortable: true },
  { key: 'type', label: '타입', sortable: true },
  { key: 'impCnt', label: '노출', sortable: true, num: true },
  { key: 'clkCnt', label: '클릭', sortable: true, num: true },
  { key: 'ctr', label: 'CTR', sortable: true, num: true },
  { key: 'cpc', label: 'CPC', sortable: true, num: true },
  { key: 'salesAmt', label: '광고비', sortable: true, num: true },
  { key: 'ccnt', label: '전환', sortable: true, num: true },
  { key: 'convAmt', label: '전환매출', sortable: true, num: true },
  { key: 'ror', label: 'ROAS', sortable: true, num: true },
];

const TYPE_LABELS = { SHOPPING: '쇼핑', WEB_SITE: '파워링크', POWER_CONTENTS: '콘텐츠', BRAND_SEARCH: '브랜드' };

function getFilteredCampaigns() {
  let list = (DATA.campaigns || []).filter(c => c.stats);
  const q = document.getElementById('searchInput').value.toLowerCase();
  if (q) list = list.filter(c => c.name.toLowerCase().includes(q));
  if (currentFilter !== 'ALL') list = list.filter(c => c.type === currentFilter);

  list.sort((a, b) => {
    let av, bv;
    if (sortCol === 'name') { av = a.name; bv = b.name; }
    else if (sortCol === 'type') { av = a.type; bv = b.type; }
    else { av = (a.stats && a.stats[sortCol]) || 0; bv = (b.stats && b.stats[sortCol]) || 0; }
    if (av < bv) return -1 * sortDir;
    if (av > bv) return 1 * sortDir;
    return 0;
  });
  return list;
}

function renderTable() {
  // Head
  document.getElementById('tableHead').innerHTML = '<tr>' + TABLE_COLS.map(c =>
    `<th class="${c.num ? 'num' : ''} ${sortCol === c.key ? 'sorted' : ''}" data-col="${c.key}">
      ${c.label}<span class="sort-icon">${sortCol === c.key ? (sortDir === 1 ? '▲' : '▼') : '⇅'}</span>
    </th>`
  ).join('') + '</tr>';

  // Body
  const list = getFilteredCampaigns();
  document.getElementById('campCount').textContent = list.length;

  document.getElementById('tableBody').innerHTML = list.map(c => {
    const s = c.stats || {};
    return `<tr>
      <td class="camp-name" title="${c.name}">${c.name}</td>
      <td><span class="type-badge type-${c.type}">${TYPE_LABELS[c.type] || c.type}</span></td>
      <td class="num">${fmt(s.impCnt, 'int')}</td>
      <td class="num">${fmt(s.clkCnt, 'int')}</td>
      <td class="num">${fmt(s.ctr, 'pct')}</td>
      <td class="num">${fmt(s.cpc, 'money')}</td>
      <td class="num num-highlight">${fmt(s.salesAmt, 'money')}</td>
      <td class="num">${fmt(s.ccnt, 'int')}</td>
      <td class="num num-highlight">${fmt(s.convAmt, 'bigmoney')}</td>
      <td class="num" style="font-weight:600;color:${(s.ror||0)>500?'var(--green)':'var(--text)'}">${fmt(s.ror, 'pct')}</td>
    </tr>`;
  }).join('');
}

// ── AI Analysis ──
async function runAIAnalysis() {
  const s = getSettings();
  const key = s.claudeKey;
  if (!key) { alert('설정에서 Claude API Key를 입력해주세요.'); showSettings(); return; }

  const el = document.getElementById('aiResult');
  el.innerHTML = '<div class="ai-loading"><div class="spinner"></div>AI가 광고 성과를 분석하고 있습니다...</div>';

  const kpi = DATA.kpi, pk = DATA.prevKpi;
  const prompt = `네이버 검색광고 주간 성과 데이터를 분석하고 핵심 인사이트를 제공해주세요.

이번주 (${DATA.period.since} ~ ${DATA.period.until}):
- 노출: ${kpi.impCnt.toLocaleString()} / 클릭: ${kpi.clkCnt.toLocaleString()} / CTR: ${kpi.ctr}%
- 광고비: ${kpi.salesAmt.toLocaleString()}원 / CPC: ${kpi.cpc.toLocaleString()}원
- 전환수: ${kpi.ccnt} / 전환매출: ${kpi.convAmt.toLocaleString()}원 / ROAS: ${kpi.ror}%
- 전환율: ${kpi.crto}% / 전환당비용: ${kpi.cpConv.toLocaleString()}원

전주 (${DATA.prevPeriod.since} ~ ${DATA.prevPeriod.until}):
- 노출: ${pk.impCnt.toLocaleString()} / 클릭: ${pk.clkCnt.toLocaleString()} / CTR: ${pk.ctr}%
- 광고비: ${pk.salesAmt.toLocaleString()}원 / CPC: ${pk.cpc.toLocaleString()}원
- 전환수: ${pk.ccnt} / 전환매출: ${pk.convAmt.toLocaleString()}원 / ROAS: ${pk.ror}%

일별 추이:
${DATA.daily.map(d => d.date + ': 광고비=' + d.salesAmt.toLocaleString() + ', 클릭=' + d.clkCnt + ', 전환=' + d.ccnt).join('\n')}

활성 캠페인: ${DATA.statsCollected}개 / 전체: ${DATA.totalCampaigns}개
캠페인 타입: 쇼핑검색 87개, 파워링크 61개, 파워콘텐츠 9개, 브랜드검색 3개

다음을 포함해서 분석해주세요:
1. 핵심 성과 요약 (전주 대비 변화)
2. 주목할 트렌드 (일별 패턴)
3. 개선 제안 (구체적 액션)
4. 주의 필요 사항

한국어로, 마크다운 없이, 짧고 핵심만 작성해주세요.`;

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': key,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1024,
        messages: [{ role: 'user', content: prompt }]
      })
    });
    const json = await res.json();
    if (json.content && json.content[0]) {
      el.innerHTML = formatAIResult(json.content[0].text);
    } else {
      el.textContent = 'AI 분석 실패: ' + (json.error?.message || JSON.stringify(json));
    }
  } catch (e) {
    el.textContent = 'AI 연결 실패: ' + e.message;
  }
}

function formatAIResult(text) {
  return text
    .replace(/(\d+\.\s*[^\n]+)/g, '<h4>$1</h4>')
    .replace(/\n/g, '<br>');
}

// ── Data Loading ──
async function loadFromWorker() {
  const s = getSettings();
  if (!s.workerUrl) return null;
  try {
    const res = await fetch(s.workerUrl + '/api/dashboard');
    if (!res.ok) return null;
    return await res.json();
  } catch { return null; }
}

async function refreshData() {
  document.getElementById('statusDot').style.background = 'var(--orange)';
  document.getElementById('statusText').textContent = '데이터 갱신 중...';

  const live = await loadFromWorker();
  if (live) {
    DATA = live;
    document.getElementById('statusText').textContent = `실시간 · ${new Date().toLocaleTimeString('ko-KR')}`;
  } else {
    // Fall back to embedded + full campaign data from localStorage
    const cached = localStorage.getItem('pokool_dash_data');
    if (cached) {
      DATA = JSON.parse(cached);
      document.getElementById('statusText').textContent = `캐시 · ${DATA.generated?.slice(0, 16) || ''}`;
    } else {
      DATA = EMBEDDED_DATA;
      document.getElementById('statusText').textContent = `스냅샷 · ${DATA.generated?.slice(0, 16) || ''}`;
    }
  }

  document.getElementById('statusDot').style.background = 'var(--green)';
  document.getElementById('periodBadge').textContent = `${DATA.period.since} ~ ${DATA.period.until}`;

  renderKPI();
  renderChart();
  renderTable();
}

// ── Event Listeners ──
document.getElementById('chartTabs').addEventListener('click', e => {
  if (!e.target.dataset.metric) return;
  document.querySelectorAll('.chart-tab').forEach(t => t.classList.remove('active'));
  e.target.classList.add('active');
  currentMetric = e.target.dataset.metric;
  renderChart();
});

document.getElementById('filterGroup').addEventListener('click', e => {
  if (!e.target.dataset.type) return;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  e.target.classList.add('active');
  currentFilter = e.target.dataset.type;
  renderTable();
});

document.getElementById('searchInput').addEventListener('input', () => renderTable());

document.addEventListener('click', e => {
  const th = e.target.closest('th[data-col]');
  if (!th) return;
  const col = th.dataset.col;
  if (sortCol === col) sortDir *= -1;
  else { sortCol = col; sortDir = -1; }
  renderTable();
});

document.getElementById('settingsModal').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeSettings();
});

// ── Init ──
// Inject full campaign data from JSON file if available
async function injectFullData() {
  try {
    const res = await fetch('./dashboard_data.json');
    if (res.ok) {
      const full = await res.json();
      localStorage.setItem('pokool_dash_data', JSON.stringify(full));
      return full;
    }
  } catch {}
  return null;
}

(async () => {
  const full = await injectFullData();
  if (full) {
    DATA = full;
  } else {
    const cached = localStorage.getItem('pokool_dash_data');
    DATA = cached ? JSON.parse(cached) : EMBEDDED_DATA;
  }
  await refreshData();
})();
</script>
